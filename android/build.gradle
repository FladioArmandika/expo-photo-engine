plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.photoengine'
version = '0.0.1'

android {
  namespace "expo.modules.photoengine"
  defaultConfig {
    versionCode 1
    versionName "0.0.1"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Writes EXIF into exported JPEG and PNG files on every Android version.
  implementation "androidx.exifinterface:exifinterface:1.3.7"
  // HEIC export (Android 9+, uses the device's HEVC encoder).
  implementation "androidx.heifwriter:heifwriter:1.0.0"
}
