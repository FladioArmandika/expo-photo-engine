name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  js:
    name: Lint, types, tests, shader check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test -- --ci
      - name: Install example dependencies
        run: npm ci
        working-directory: example
      - name: Type-check example
        run: npx tsc --noEmit
        working-directory: example
      - name: GLSL vs reference (headless Chromium WebGL2)
        run: |
          npx playwright-core install chromium
          node scripts/check-glsl.mjs

  android:
    name: Android build and golden export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform android --no-install
        working-directory: example
      - name: Assemble example app (compiles the module's Kotlin)
        run: ./gradlew assembleDebug --no-daemon
        working-directory: example/android
      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Export the golden images on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: adb install -r example/android/app/build/outputs/apk/debug/app-debug.apk && scripts/golden-run.sh android - golden/android
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-android
          path: golden/android
          if-no-files-found: ignore

  ios:
    name: iOS build and golden export
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Compile Metal shaders offline
        run: node scripts/check-metal.mjs
      - run: npm ci
      - run: npm ci
        working-directory: example
      - run: npx expo prebuild --platform ios
        working-directory: example
      - name: Build example app for the simulator (compiles the module's Swift and Metal source)
        working-directory: example/ios
        run: |
          workspace=$(ls -d *.xcworkspace | head -1)
          scheme="${workspace%.xcworkspace}"
          set -o pipefail
          xcodebuild -workspace "$workspace" -scheme "$scheme" -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -200
      - name: Export the golden images on the simulator
        run: |
          app=$(find example/ios/build/Build/Products -maxdepth 2 -name '*.app' | head -1)
          udid=$(xcrun simctl list devices available -j \
            | node -e 'const d=JSON.parse(require("fs").readFileSync(0)).devices; console.log(Object.entries(d).filter(([r])=>r.includes("iOS")).flatMap(([,l])=>l).find((x)=>x.name.startsWith("iPhone")).udid)')
          xcrun simctl boot "$udid"
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" "$app"
          scripts/golden-run.sh ios "$udid" golden/ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-ios
          path: golden/ios
          if-no-files-found: ignore

  golden:
    name: iOS vs Android golden images
    needs: [android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: golden-ios
          path: golden/ios
      - uses: actions/download-artifact@v4
        with:
          name: golden-android
          path: golden/android
      - run: node scripts/golden-compare.mjs golden/ios golden/android golden/diff
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-diff
          path: golden/diff
          if-no-files-found: ignore
